[configuration]
status = "warn"
monitorInterval = "30s"

[configuration.properties]
LOG_DIR = "${env:GOARK_LOG_DIR:-logs}"
PATTERN = "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p %pid --- [%thread] %c : %m%attrs%n"

[configuration.asyncLogger]
enabled = true
queueSize = 4096
batchSize = 128
overflowStrategy = "drop-debug"
waitStrategy = "yield"
includeLocation = false

[configuration.appenders.console]
type = "console"
target = "stderr"

[configuration.appenders.console.layout]
type = "pattern"
pattern = "${prop:PATTERN}"
disableAnsi = true

[configuration.appenders.jsonFile]
type = "json"
fileName = "${prop:LOG_DIR}/toml-app.json"
bufferSize = "256KiB"
flushOnWrite = false

[configuration.filters.auditMarker]
type = "marker"
marker = "AUDIT"
onMatch = "accept"
onMismatch = "neutral"

[configuration.root]
level = "info"
appenderRefs = ["console", "jsonFile"]

[configuration.loggers."goark.audit"]
level = "info"
appenderRefs = ["jsonFile"]
filterRefs = ["auditMarker"]
additivity = false
