status=warn
monitorInterval=30s
property.LOG_DIR=${env:GOARK_LOG_DIR:-logs}
property.PATTERN=%d{yyyy-MM-dd HH:mm:ss.SSS} %5p %pid --- [%thread] %c : %m%attrs%n

asyncLogger.enabled=true
asyncLogger.queueSize=4096
asyncLogger.batchSize=128
asyncLogger.overflowStrategy=drop-debug
asyncLogger.waitStrategy=yield
asyncLogger.includeLocation=false

appender.console.type=console
appender.console.target=stderr
appender.console.layout.type=pattern
appender.console.layout.pattern=${PATTERN}
appender.console.layout.disableAnsi=true

appender.json.type=json
appender.json.fileName=${LOG_DIR}/properties-app.json
appender.json.bufferSize=256KiB
appender.json.flushOnWrite=false

filter.auditMarker.type=marker
filter.auditMarker.marker=AUDIT
filter.auditMarker.onMatch=accept
filter.auditMarker.onMismatch=neutral

rootLogger.level=info
rootLogger.appenderRefs=console,json

logger.audit.name=goark.audit
logger.audit.level=info
logger.audit.appenderRefs=json
logger.audit.filters=auditMarker
logger.audit.additivity=false
