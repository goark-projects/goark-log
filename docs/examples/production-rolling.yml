configuration:
  monitorInterval: 30s
  properties:
    LOG_DIR: logs
  asyncLogger:
    enabled: true
    queueSize: 8192
    batchSize: 256
    overflowStrategy: block
    waitStrategy: yield
    includeLocation: false
  appenders:
    console:
      type: console
      target: stderr
      layout:
        type: pattern
        pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p %pid --- [%thread] %c : %m%attrs%n"
    rolling:
      type: rolling-file
      fileName: "${prop:LOG_DIR}/app.log"
      bufferSize: 256KiB
      append: true
      createOnDemand: true
      filePermissions: "0644"
      layout:
        type: json
        eventEol: true
        includeStacktrace: true
      rolling:
        filePattern: "${prop:LOG_DIR}/archive/app-%d{yyyyMMdd-HHmmss}-%06i.log.gz"
        policies:
          size:
            size: 100MiB
          time:
            interval: daily
            modulate: true
          startup:
            enabled: true
        strategy:
          max: 30
          maxAge: 30d
          fileIndex: nomax
          compression:
            gzip: true
            async: true
          delete:
            basePath: "${prop:LOG_DIR}/archive"
            maxDepth: 1
            ifFileName:
              glob: "*.log.gz"
            ifLastModified:
              age: 30d
            async: true
  root:
    level: info
    appenderRefs:
      - console
      - ref: rolling
        level: info
  loggers:
    goark.orm:
      level: debug
      appenderRefs: [rolling]
      additivity: false
