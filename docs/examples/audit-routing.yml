configuration:
  properties:
    LOG_DIR: "${env:GOARK_LOG_DIR:-logs}"
  appenders:
    stdout:
      type: json
      target: stdout
    tenantA:
      type: file
      fileName: "${prop:LOG_DIR}/tenant-a.log"
      layout:
        type: json
        eventEol: true
    tenantB:
      type: file
      fileName: "${prop:LOG_DIR}/tenant-b.log"
      layout:
        type: json
        eventEol: true
    router:
      type: routing
      routeKey: tenant
      defaultRoute: stdout
      routes:
        tenant-a: tenantA
        tenant-b: tenantB
    redacted:
      type: rewrite
      appenderRefs: [router]
      rewrite:
        attrs:
          service: billing
        removeAttrs: [password, token, authorization]
  root:
    level: info
    appenderRefs: [redacted]
