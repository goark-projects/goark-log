configuration:
  properties:
    LOG_PATTERN: "%d{yyyy-MM-dd HH:mm:ss.SSS} %highlight{%-5p} %pid --- [%thread] %c : %m%attrs%n"
  appenders:
    console:
      type: console
      target: stderr
      layout:
        type: pattern
        pattern: "${prop:LOG_PATTERN}"
        disableAnsi: false
  root:
    level: debug
    appenderRefs: [console]
