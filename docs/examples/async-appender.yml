configuration:
  appenders:
    jsonFile:
      type: json
      fileName: logs/app.json
      bufferSize: 256KiB
    asyncJson:
      type: async
      appenderRefs: [jsonFile]
      queueSize: 4096
      batchSize: 128
      overflowStrategy: block
      waitStrategy: yield
      waitRetries: 100
      sleepTime: 100us
  root:
    level: info
    appenderRefs: [asyncJson]
