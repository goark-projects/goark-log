name: ci

on:
  push:
    branches:
      - dev
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test core module
        run: go test ./...

      - name: Test comparison module
        working-directory: benchmarks/compare
        run: go test ./...

      - name: Race focused hot paths
        run: go test -race -run 'TestAsync(Logger|Appender)|TestRollingFileAppender|TestFileAppender|TestJSON' -count=1 -timeout=10m ./...

  bench-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Benchmark smoke
        run: go test -run '^$' -bench 'BenchmarkLayout/json$|BenchmarkNativeLoggerDirectJSON3$|BenchmarkAsyncLoggerParallel3$|BenchmarkFileAppenderParallel$' -benchmem -benchtime=1s -count=1 ./benchmarks/core

      - name: Internal benchmark smoke
        run: go test -run '^$' -bench . -benchmem -benchtime=1s -count=1 ./internal/disruptor ./internal/jsoncodec
